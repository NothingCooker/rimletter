name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish release
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimLetter-windows
          path: dist/*.exe

  # Linux 发布：等 Windows 任务先创建好 Draft Release，再把 Linux 产物并入同一 Release。
  # （并发 publish 可能竞争创建 draft；串行 needs 保证 electron-builder 能查到已存在的 release）
  release-linux:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # apt 源偶发网络卡死（曾卡 50 分钟无输出）：加获取重试与超时，避免整个 job 无限等待
      - name: Install system dependencies
        timeout-minutes: 8
        run: sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 && sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish Linux release
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimLetter-linux
          # upload-artifact v4 的 path 多模式需换行分隔（空格会被当作单个字面模式，匹配不到任何文件）
          path: |
            dist/*.AppImage
            dist/*.deb
