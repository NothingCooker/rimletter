name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run build -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimLetter-windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # AppImage 构建/运行所需（构建不依赖 fuse，装上便于后续在 runner 上冒烟运行产物）
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux packages
        run: npm run build -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimLetter-linux
          path: dist/*
