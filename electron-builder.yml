appId: com.rimletter.app
productName: RimLetter
copyright: Copyright (c) 2026
publish:
  - provider: github
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - assets/**
  - plugins/**
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
        - arm64
  # 稳定文件名（不带版本号）：README 的 releases/latest/download/ 下载链接依赖此名，发版时勿改
  artifactName: ${productName}-Setup-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
